installment:()=>`<section class="sec"><div class="w cols2 top"><div class="rv"><h1>Рассрочка</h1><p>Первый взнос — от 60%. Остаток делим на равные ежемесячные платежи на срок от 1 до 6 месяцев.</p><p>Ставка в расчёте — 12% годовых. Точные условия подтверждает менеджер.</p><h2 class="gap">Как оформить</h2><ol><li>Выберите модель и рассчитайте платёж.</li><li>Оставьте заявку, менеджер свяжется с вами.</li><li>Подпишите договор и внесите первый взнос.</li><li>Получите технику.</li></ol></div>
<form id="calc" class="calc rv"><label>Модель<select name="m">${T.filter(t=>t.i).map(t=>`<option value="${t.id}" data-p="${t.r}"${t.id==sel?' selected':''}>${t.n}, ${fm(t.r)}</option>`).join('')}</select></label><label>Первый взнос: <b id="od"></b><input name="d" type="range" min="60" max="90" step="5" value="60"></label><label>Срок<select name="n">${[1,2,3,4,5,6].map(i=>`<option value="${i}">${i} мес.</option>`).join('')}</select></label><label>Ставка, % годовых<input name="r" value="12" readonly></label><div class="res"><span>Ежемесячный платёж<b id="o1"></b></span><span>Переплата<b id="o2"></b></span><span>Итоговая сумма<b id="o3"></b></span></div><a class="btn o" href="#contacts">Оставить заявку</a></form></div></section>
<section class="sec alt"><div class="w"><h2>Вопросы и ответы</h2><details><summary>Какой первый взнос?</summary><p>От 60% стоимости трактора.</p></details><details><summary>На какой срок оформляется рассрочка?</summary><p>От 1 до 6 месяцев.</p></details><details><summary>Какие документы нужны?</summary><p>Перечень назовёт менеджер при оформлении заявки.</p></details><details><summary>Как узнать точный платёж?</summary><p>Калькулятор даёт расчёт. Окончательные условия подтверждает менеджер.</p></details></div></section>`,
about:()=>`<section class="sec"><div class="w cols2 top"><div class="rv"><h1>О компании</h1><p>Chimgan продаёт тракторы и навесное оборудование в Узбекистане. Помогаем подобрать технику под задачи хозяйства и купить её в рассрочку.</p></div><div class="rv"><h2>История</h2><p>Здесь расскажите, когда компания начала работу и какую технику поставляет.</p></div></div></section>
<section class="sec alt"><div class="w"><h2 class="rv">Команда</h2><div class="cols4 tm">${US.map(u=>`<div class="rv"><span class="av">${u[2]}</span><h3>${u[0]}</h3><p class="m">${u[1]}</p></div>`).join('')}</div></div></section>
<section class="sec"><div class="w cols4"><div class="rv"><h3>Склад</h3><p>Техника хранится на складе компании. Наличие и сроки поставки подтверждает менеджер.</p></div><div class="rv"><h3>Гарантии</h3><p>На технику действует гарантия. Условия и срок указываются в договоре.</p></div><div class="rv"><h3>Сервис</h3><p>Помогаем с обслуживанием после покупки.</p></div></div></section>`,
contacts:()=>`<section class="sec"><div class="w cols2 top"><div class="rv"><h1>Контакты</h1><table><tr><th>Телефон</th><td>+998 71 210 90 90</td></tr><tr><th>Почта</th><td>chimgan.tractors@gmail.com</td></tr><tr><th>Адрес</th><td>Zangiota tumani, M39 BUT5, Erkin post</td></tr><tr><th>График</th><td>Пн–Пт, 9:00–18:00</td></tr></table></div><div class="map rv">Здесь будет карта</div></div></section><section class="sec alt" id="form"><div class="w cols2"><div><h2>Напишите нам</h2><p>Ответим в рабочее время.</p></div><div>${form()}</div></div></section>`,
admin:()=>adm()};
H.catalog=()=>{const f=$('fl'),run=()=>{const v=Object.fromEntries(new FormData(f)),q=(v.q||'').toLowerCase();
 const r=T.filter(t=>(!q||(t.n+' '+t.b).toLowerCase().includes(q))&&(!v.b||t.b==v.b)&&(!v.c||t.c==v.c)&&(!v.d||t.d==v.d)&&(!v.pa||t.p>=+v.pa)&&(!v.pb||t.p<=+v.pb)&&(!v.ra||t.r>=+v.ra)&&(!v.rb||t.r<=+v.rb)),k={p1:'r',p2:'r',w1:'p',w2:'p'}[v.s];
 if(k)r.sort((a,b)=>(a[k]-b[k])*(v.s[1]==2?-1:1));$('n').textContent=r.length;$('gr').innerHTML=r.map(card).join('')||'<p>Ничего не найдено. Измените фильтры.</p>';reveal()};f.oninput=run;run()};
H.installment=()=>{const f=$('calc'),run=()=>{const p=+f.m.selectedOptions[0].dataset.p,d=+f.d.value,n=+f.n.value,fin=p*(1-d/100),ov=fin*(+f.r.value)/100*n/12;
 $('od').textContent=d+'% ('+fm(p*d/100)+')';$('o1').textContent=fm((fin+ov)/n);$('o2').textContent=fm(ov);$('o3').textContent=fm(p+ov)};f.oninput=run;run()};
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.1}),
reveal=()=>document.querySelectorAll('.rv:not(.in)').forEach(el=>io.observe(el)),
R=()=>{const h=location.hash.slice(1),m=h.match(/^tractor-(.+)$/),k=m?'tractor':P.hasOwnProperty(h)?h:'home';
 $('app').innerHTML=m?P.tractor(m[1]):P[k]();if(H[k])H[k]();scrollTo(0,0);reveal();fx()};

if(!window.fxl){window.fxl=1;let ly=0,tk=0;const upd=()=>{tk=0;const y=scrollY,mx=root.scrollHeight-innerHeight,sc=document.querySelector('.scene'),pb=document.querySelector('.pb');root.style.setProperty('--sy',y);if(pb)pb.style.transform='scaleX('+(mx>0?y/mx:0)+')';document.body.classList.toggle('sc',y>8);document.body.classList.toggle('hd',innerWidth<861&&!root.classList.contains('mo')&&y>ly&&y>160);ly=y;if(sc){const r=sc.getBoundingClientRect();sc.style.setProperty('--p',Math.min(1,Math.max(0,(innerHeight-r.top)/(innerHeight+r.height))).toFixed(4))}};addEventListener('scroll',()=>{tk||(tk=requestAnimationFrame(upd))},{passive:true});addEventListener('resize',upd);window.fxu=upd}
window.fxu();
